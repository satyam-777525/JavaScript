<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>DOM</h1>
    <div id="main">
        <h1 id="child1">satyam</h1>
        <h1 id="child2">chinu</h1>
        <h1 id="child3">satyam varshney</h1>
    </div>
    <button onclick="btao()">click me</button>

    <script>
        var ele=document.getElementById("main")
        function btao(){
            console.log(ele.parentElement) //parent element of main div
            console.log(ele.children) //children of main div
            console.log(ele.firstElementChild) //first child of main div
            console.log(ele.lastElementChild) //last child of main div
            console.log(ele.nextElementSibling) //next sibling of main div
            console.log(ele.previousElementSibling) //previous sibling of main div
            
        }
    </script>
</body>
</html>
