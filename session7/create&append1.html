<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <h1>JAVASCRIPT</h1>
        <h2 id="heading">radhe radhe</h2>
    </div>
    <button onclick="fun()">add</button>
    <script>
        var container=document.getElementById("container");
        var head=document.getElementById("heading")
        function fun(){
            var tag=document.createElement("h2"); // create the element
            tag.textContent="satyam varshney"
            tag.style.backgroundColor="yellow"

            // append 
            // container.appendChild(tag);
            // container.append("hello",tag)
            // container.prepend(tag)
            container.insertBefore(tag,head)
            
        }
    </script>
    
</body>
</html>
