<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ON FOCUS</h1>
    <input type="text" onfocus="fun(event)" onblur="funn(event)">
    <!-- jb bhi m input filled pr click karunga ya focus karunga tb uska color change hoga yhi hota h (onfocus)...and (onblur) means jb bhi m input feild ko chodunga tb uska color green hoga  -->
 
    <script>
        function fun(event){
            console.log(event.type)
            event.target.style.backgroundColor="red";
        }
        function funn(event){
            console.log(event.type)
            event.target.style.backgroundColor="green"
        }
    </script>
    
</body>
</html>
